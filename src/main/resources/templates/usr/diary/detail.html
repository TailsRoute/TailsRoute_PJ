<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Pet Diary Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fdf6e3;
            color: #5a4035;
        }
        .container {
            background-color: #fff8e1;
            animation: fadeIn 1s ease-out;
        }
        h1, h2 {
            color: #8b5e3b;
        }
        .btn {
            background-color: #d8a86c;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #b38355;
            transform: scale(1.05);
        }
        .diary-image img {
            transition: transform 0.5s ease;
        }
        .diary-image img:hover {
            transform: scale(1.02);
        }
        /* 페이드 인 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* 요소 슬라이드 인 애니메이션 */
        .slide-in {
            animation: slideIn 1s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-fdf6e3">

<!-- 헤더 -->
<div class="header">
    <th:block th:replace="usr/common/head"/>
</div>

<!-- 메인 콘텐츠 -->
<div class="container mx-auto p-6 rounded-lg shadow-lg max-w-3xl mt-14">
    <!-- 제목 -->
    <h1 class="text-3xl font-bold text-center mb-4 slide-in" th:text="${diary.title}"></h1>

    <!-- 다이어리 상세정보 -->
    <div class="text-center mb-6 slide-in">
        <p><strong th:text="${diary.extra__writer}"></strong> | <span th:text="${diary.regDate}"></span></p>
    </div>

    <!-- 확대 효과가 있는 이미지 -->
    <div class="diary-image mb-6">
        <img th:src="${diary.imagePath}" alt="Diary Image" class="w-full h-auto rounded-lg shadow-md border-4 border-brown-200" >
    </div>

    <!-- 본문 텍스트 -->
    <p class="text-lg leading-relaxed mb-8 px-4 slide-in" th:text="${diary.body}"></p>

    <!-- 복용약 정보 테이블 (부드러운 슬라이드 인 효과 포함) -->
    <div class="bg-brown-100 p-4 rounded-lg shadow-inner mb-6 slide-in">
        <h2 class="text-xl font-semibold text-center mb-4">복용약 정보</h2>
        <table class="w-full text-gray-700 text-left">
            <tr>
                <td class="py-2 font-medium">복용 시작일</td>
                <td class="py-2" th:text="${diary.startDate}"></td>
            </tr>
            <tr>
                <td class="py-2 font-medium">복용 종료일</td>
                <td class="py-2" th:text="${diary.endDate}"></td>
            </tr>
            <tr>
                <td class="py-2 font-medium">복용 시간</td>
                <td class="py-2" th:text="${diary.takingTime}"></td>
            </tr>
            <tr>
                <td class="py-2 font-medium">내용</td>
                <td class="py-2" th:text="${diary.information}"></td>
            </tr>
        </table>
    </div>

    <!-- 행동 버튼 (호버 시 확대 효과 포함) -->
    <div class="flex justify-center space-x-4">
        <a th:href="@{|/usr/diary/modify/${diary.id}|}" class="btn text-white py-2 px-4 rounded-lg shadow-md slide-in">수정</a>
        <form th:action="@{|/usr/diary/delete/${diary.id}|}" method="post">
            <button type="submit" class="btn text-white py-2 px-4 rounded-lg shadow-md slide-in" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
        </form>
        <a href="/usr/diary/list" class="btn text-white py-2 px-4 rounded-lg shadow-md slide-in">목록</a>
    </div>
</div>

</body>
</html>
